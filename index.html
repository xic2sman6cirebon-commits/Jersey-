<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Jersey XI.C2</title>
<style>
  :root{
    --brand:#4f46e5; --brand-2:#7c3aed; --brand-3:#06b6d4;
    --success:#10b981; --danger:#ef4444; --warning:#f59e0b;
    --bg:#f8fafc; --surface:#ffffff; --text:#0f172a; --muted:#64748b;
    --border:#e2e8f0; --border-strong:#cbd5e1;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;padding-bottom:40px;-webkit-font-smoothing:antialiased;}
  
  /* Progress Bar */
  .progress-wrap{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:10px 16px}
  .progress-inner{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .progress-track{flex:1;height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden}
  .progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--brand),var(--brand-2),var(--brand-3));background-size:200% 100%;border-radius:99px;transition:width .4s ease}
  .progress-text{font-size:12px;font-weight:700;color:var(--brand)}

  .page{max-width:680px;margin:0 auto;padding:16px}

  /* Hero */
  .hero{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 45%,#06b6d4 100%);color:#fff;padding:30px 24px;border-radius:24px;margin-bottom:20px;text-align:center;box-shadow:0 20px 40px -12px rgba(79,70,229,.5);position:relative;overflow:hidden}
  .hero::before{content:'';position:absolute;inset:-50%;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.25),transparent 40%);animation:rotate 20s linear infinite}
  @keyframes rotate{to{transform:rotate(360deg)}}
  .hero-content{position:relative;z-index:1}
  .hero-badge{display:inline-block;padding:6px 14px;background:rgba(255,255,255,.2);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.3);border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:14px}
  .hero h1{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
  .hero p{font-size:13px;opacity:.95}

  /* Gallery */
  .gallery{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
  @media(max-width:460px){.gallery{grid-template-columns:1fr}}
  .img-card{background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:0 4px 24px -8px rgba(15,23,42,.12);border:1px solid var(--border);transition:.2s}
  .img-head{padding:10px 14px;font-weight:700;font-size:12px;color:var(--brand);background:linear-gradient(135deg,#eef2ff,#f5f3ff);border-bottom:1px solid #e0e7ff;display:flex;align-items:center;gap:6px;letter-spacing:.3px;text-transform:uppercase}
  .img-head .dot{width:6px;height:6px;border-radius:50%;background:var(--brand-2)}
  .img-body{background:#f8fafc;min-height:180px;padding:8px;display:flex;align-items:center;justify-content:center;cursor:zoom-in;position:relative;overflow:hidden}
  .img-body img{width:100%;height:auto;display:block;border-radius:10px;transition:.25s}
  .img-body:hover img{opacity:.94;transform:scale(1.03)}
  .img-placeholder{font-size:11px;color:var(--muted);text-align:center;padding:30px 16px;line-height:1.5}

  /* Card & Form */
  .card{background:var(--surface);border-radius:20px;padding:24px;box-shadow:0 4px 24px -8px rgba(15,23,42,.12);border:1px solid var(--border)}
  .card-title{font-size:18px;font-weight:800;margin-bottom:16px;letter-spacing:-.3px}
  
  .step{display:flex;gap:12px;padding:14px 0;border-top:1px dashed var(--border)}
  .step:first-of-type{border-top:none;padding-top:0}
  .step-num{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:6px;transition:.3s}
  .step-num.done{background:linear-gradient(135deg,var(--success),#34d399)}
  .step-content{flex:1;min-width:0}
  .label-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
  label{font-weight:700;font-size:14px;color:var(--text)}
  
  .badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap;opacity:0;transform:scale(.8);transition:.2s;display:inline-block}
  .badge.show{opacity:1;transform:scale(1)}
  .badge.ok{background:#dcfce7;color:#15803d}
  .badge.bad{background:#fee2e2;color:#b91c1c}
  .help{font-size:11.5px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:4px}

  input,select{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:12px;font-size:15px;background:#fff;font-family:inherit;color:var(--text);transition:.15s}
  input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(79,70,229,.12)}
  input.valid,select.valid{border-color:var(--success);background:#f0fdf4}
  input.invalid,select.invalid{border-color:var(--danger);background:#fef2f2}
  input:disabled,select:disabled{background:#f1f5f9;color:var(--muted);cursor:not-allowed}

  /* Size picker */
  .size-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  @media(min-width:520px){.size-grid{grid-template-columns:repeat(9,1fr)}}
  .size-btn{padding:12px 4px;border:2px solid var(--border);border-radius:10px;text-align:center;cursor:pointer;font-weight:800;font-size:13px;background:#fff;user-select:none;transition:.15s;position:relative}
  .size-btn:hover{border-color:var(--brand);background:#eef2ff;transform:translateY(-1px)}
  .size-btn.selected{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;box-shadow:0 6px 16px -4px rgba(79,70,229,.5);transform:translateY(-1px)}

  .btn{width:100%;padding:16px;border:none;border-radius:14px;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:.2s;letter-spacing:.2px;margin-top:20px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 8px 24px -6px rgba(79,70,229,.5)}
  .btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 14px 32px -6px rgba(79,70,229,.55)}
  .btn:disabled{background:#94a3b8;box-shadow:none;cursor:not-allowed;transform:none}

  /* Blocked banner */
  .blocked{padding:22px 20px;text-align:center;border-radius:16px;background:linear-gradient(135deg,#fef3c7,#fed7aa);border:2px solid #f59e0b;margin-bottom:18px}
  .blocked .icon{font-size:44px;margin-bottom:8px;display:block;line-height:1}
  .blocked h3{color:#78350f;font-size:16px;margin-bottom:6px;font-weight:800}
  .blocked p{color:#92400e;font-size:13px;line-height:1.55}

  /* Toast */
  #toastArea{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;width:calc(100% - 32px);max-width:420px;pointer-events:none}
  .toast{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border-radius:14px;background:#fff;box-shadow:0 12px 32px -8px rgba(15,23,42,.25);border-left:4px solid var(--brand);opacity:0;transform:translateY(-20px) scale(.95);transition:.3s cubic-bezier(.34,1.56,.64,1);pointer-events:auto;font-size:13.5px;line-height:1.5}
  .toast.show{opacity:1;transform:translateY(0) scale(1)}
  .toast-icon{font-size:18px;flex-shrink:0;line-height:1.3}
  .toast.error{border-left-color:var(--danger)} .toast.success{border-left-color:var(--success)} .toast.warning{border-left-color:var(--warning)}

  /* Success */
  .success-screen{text-align:center;padding:34px 16px;animation:pop .4s}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  .success-ring{width:92px;height:92px;border-radius:50%;background:linear-gradient(135deg,var(--success),#34d399);margin:0 auto 22px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:48px;font-weight:700;box-shadow:0 20px 40px -12px rgba(16,185,129,.6)}
  .success-screen h2{font-size:22px;font-weight:800;margin-bottom:8px;letter-spacing:-.3px}
  .success-details{background:linear-gradient(135deg,#f8fafc,#f1f5f9);border:1px solid var(--border);border-radius:14px;padding:16px;max-width:340px;margin:0 auto 24px;text-align:left;font-size:14px}
  .success-details .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--border-strong);gap:12px}
  .success-details .row:last-child{border-bottom:none}
  .success-details .k{color:var(--muted);font-size:12.5px}
  .success-details .v{font-weight:800;text-align:right}

  .lightbox{position:fixed;inset:0;background:rgba(15,23,42,.95);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
  .lightbox.show{display:flex}
  .lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}
  .lb-close{position:absolute;top:20px;right:20px;width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:26px;cursor:pointer}
</style>
</head>
<body>

<div class="progress-wrap">
  <div class="progress-inner">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">0/4</div>
  </div>
</div>

<div id="toastArea"></div>

<div class="page">
  <div class="hero">
    <div class="hero-content">
      <div class="hero-badge">Khusus Kelas XI.C2</div>
      <h1>🧥 Jersey XI.C2</h1>
      <p>Formulir Pemesanan Jersey</p>
    </div>
  </div>

  <div class="gallery">
    <div class="img-card">
      <div class="img-head"><span class="dot"></span>Desain Jersey</div>
      <div class="img-body" onclick="openLightbox('jerseyImg')">
        <!-- Gambar desain telah diganti ke IMG-20261013-WA0019.jpg -->
        <img id="jerseyImg" src="IMG-20261013-WA0019.jpg" alt="Desain Jersey" onerror="this.style.display='none';this.parentNode.innerHTML='<div class=\'img-placeholder\'>Gagal memuat gambar.<br>Pastikan nama file sama persis.</div>'">
      </div>
    </div>
    <div class="img-card">
      <div class="img-head"><span class="dot"></span>Ukuran Jersey</div>
      <div class="img-body" onclick="openLightbox('sizeImg')">
        <img id="sizeImg" src="IMG-20261110-WA0043.jpg" alt="Ukuran Jersey" onerror="this.style.display='none';this.parentNode.innerHTML='<div class=\'img-placeholder\'>Gagal memuat gambar.<br>Pastikan nama file sama persis.</div>'">
      </div>
    </div>
  </div>

  <div class="card" id="mainCard">
    <div class="card-title">📋 Data Pemesan</div>

    <div id="blockedBox"></div>

    <form id="jerseyForm" onsubmit="submitForm(event)" autocomplete="off">
      <!-- 1. Nama Lengkap -->
      <div class="step">
        <div class="step-num" id="num1">1</div>
        <div class="step-content">
          <div class="label-row">
            <label>Nama Lengkap</label>
            <span class="badge" id="fullNameBadge"></span>
          </div>
          <select id="namaLengkap" required>
            <option value="">— Pilih nama lengkap —</option>
          </select>
        </div>
      </div>

      <!-- 2. Nama Jersey -->
      <div class="step">
        <div class="step-num" id="num2">2</div>
        <div class="step-content">
          <div class="label-row">
            <label>Nama di Jersey</label>
            <span class="badge" id="namaJerseyBadge"></span>
          </div>
          <input type="text" id="namaJersey" maxlength="15" placeholder="Contoh: ABIYYU" required inputmode="text">
          <div class="help">Maks 15 huruf &amp; spasi</div>
        </div>
      </div>

      <!-- 3. No Punggung -->
      <div class="step">
        <div class="step-num" id="num3">3</div>
        <div class="step-content">
          <div class="label-row">
            <label>No Punggung</label>
            <span class="badge" id="noPunggungBadge"></span>
          </div>
          <input type="text" id="noPunggung" inputmode="numeric" placeholder="1 – 1000" maxlength="4" required>
          <div class="help">Angka 1–1000</div>
        </div>
      </div>

      <!-- 4. Ukuran -->
      <div class="step">
        <div class="step-num" id="num4">4</div>
        <div class="step-content">
          <label style="display:block;margin-bottom:10px">Ukuran Jersey (Dewasa)</label>
          <div class="size-grid" id="sizeOptions">
            <div class="size-btn" data-size="XS">XS</div>
            <div class="size-btn" data-size="S">S</div>
            <div class="size-btn" data-size="M">M</div>
            <div class="size-btn" data-size="L">L</div>
            <div class="size-btn" data-size="XL">XL</div>
            <div class="size-btn" data-size="2XL">2XL</div>
            <div class="size-btn" data-size="3XL">3XL</div>
            <div class="size-btn" data-size="4XL">4XL</div>
            <div class="size-btn" data-size="5XL">5XL</div>
          </div>
        </div>
      </div>

      <button type="submit" class="btn" id="submitBtn">
        <span>Simpan Data</span>
      </button>
    </form>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lb-close" onclick="event.stopPropagation();closeLightbox()">×</button>
  <img id="lightboxImg" src="">
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxCDBaiRNZn_v3I6OzF1Cl9CaDRShvyZnXyREhA5jo15ahDTdhiGGPmDt8vP-xpjQCq/exec";

  const NAMA_LIST = [
    "ABIYYU TSAQIB","ACHMAD RIBERY ALHAKIM","AFIFA ZIAULIMA AZMI","AIRA PURNAMA SYACHPUTRI",
    "ALFIAN NENDIE DJUANTORO","ALISA AZ ZIKRA","ALMAIRA DAMAI YANTI","ALMIRA DINEFI APRILIANI",
    "ALYSYA LUTHFIAH SALMA","ARFEILA NARUMI PUTRI","ASYIFA SUCI YULIANTI","ATHAILLA DAFFA ARIFQIY",
    "AUREL RAISHA KAMILA","BELLA MEICCA RAHMALANY","BINTANG USWATUN HASANAH","CAMELIA VERBENA",
    "CHRYSTAL RIZKY AR-RAHMEE","DAVINA THALITA SYAKHI","DENZEL IZZJABAR HADEES","DZAKY NUGRAHA",
    "DZALFA SYIFFA AZZHARA","ELSA SUTRISNO PUTRI","FATHIR AZZAM AL GIBRAN","FATIMAH FAADHILA FATIN",
    "KEISHA DIFA NADIA","KHANZA FAUZIAH","KIKI RIZQIAH","LINDA SEFIANA","LUTFI YANUAR PRATAMA",
    "MARSA LUTFIYAH","MOCHAMAD RIZAL SYIDIQ","MOH RAFA RAISSA ISMAYANDA","MUHAMMAD ALFARO KISHENDRA",
    "MUHAMMAD IRFAN RAMADHAN","MUHAMMAD ZHAFRAN ABIYYU BROTO","NAFISA OKTAVIA","NAZWA KIRANA HERMANTO",
    "NEEVANY WAHYU AZHARA","NONA SUHENDRA","PETRA PUTRA MARDHANY","PUTRI SALSABILA",
    "RANIAH PUTRI RAHAYU","RHISMA BINTANG KIRANA","RISYA SYAFIRA PUTRI","RIZKYANA NUR NOVIANTI",
    "SRI ANDINI","SRI AYU CAHAYA MARTHA","SYAKIRA RESPADI","WINDA SYAFINA JASMINE"
  ];

  let selectedSize = '';
  let takenNames = new Set();
  let takenNumbers = new Set();
  let registeredFullNames = new Set();
  let isBlocked = false;

  const selectEl = document.getElementById('namaLengkap');
  const namaJerseyEl = document.getElementById('namaJersey');
  const noPunggungEl = document.getElementById('noPunggung');
  const submitBtn = document.getElementById('submitBtn');
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');

  NAMA_LIST.forEach(n => {
    const o = document.createElement('option');
    o.value = n; o.textContent = n;
    selectEl.appendChild(o);
  });

  function toast(msg, type){
    const icons = {error:'⚠️', success:'✅', info:'ℹ️', warning:'🔔'};
    const el = document.createElement('div');
    el.className = 'toast ' + (type||'info');
    el.innerHTML = '<span class="toast-icon">'+icons[type||'info']+'</span><div>'+msg+'</div>';
    document.getElementById('toastArea').appendChild(el);
    setTimeout(()=>el.classList.add('show'), 20);
    setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(), 320); }, 3500);
  }

  function openLightbox(id){
    const img = document.getElementById(id);
    if (!img || !img.src || img.style.display === 'none' || img.naturalWidth === 0) return;
    document.getElementById('lightboxImg').src = img.src;
    document.getElementById('lightbox').classList.add('show');
  }
  function closeLightbox(){ document.getElementById('lightbox').classList.remove('show'); }

  document.querySelectorAll('.size-btn').forEach(el => {
    el.addEventListener('click', () => {
      if (isBlocked) return;
      document.querySelectorAll('.size-btn').forEach(x => x.classList.remove('selected'));
      el.classList.add('selected');
      selectedSize = el.dataset.size;
      updateProgress();
    });
  });

  function updateProgress(){
    let done = 0;
    if (selectEl.value) done++;
    if (namaJerseyEl.value.trim().length >= 2 && !namaJerseyEl.classList.contains('invalid')) done++;
    if (noPunggungEl.value.trim().length >= 1 && !noPunggungEl.classList.contains('invalid')) done++;
    if (selectedSize) done++;
    
    progressFill.style.width = ((done/4)*100) + '%';
    progressText.textContent = done + '/4';
  }

  function setBadge(id, state, text){
    const b = document.getElementById(id);
    b.className = 'badge show ' + state;
    b.textContent = text;
  }
  function clearBadge(id){ document.getElementById(id).className = 'badge'; }

  function loadExisting(){
    fetch(GAS_URL + "?action=getData")
      .then(res => res.json())
      .then(data => {
        takenNames = new Set((data.names||[]).map(s=>String(s).toUpperCase().trim()));
        takenNumbers = new Set((data.numbers||[]).map(s=>String(s).trim()));
        registeredFullNames = new Set((data.fullNames||[]).map(s=>String(s).toUpperCase().trim()));
        if (selectEl.value) checkFullName();
        if (namaJerseyEl.value) validateNamaJersey();
        if (noPunggungEl.value) validateNoPunggung();
      })
      .catch(err => console.warn('Gagal load data:', err));
  }

  function checkFullName(){
    const val = selectEl.value;
    const box = document.getElementById('blockedBox');
    if (!val){ box.innerHTML = ''; isBlocked = false; enableForm(); clearBadge('fullNameBadge'); updateProgress(); return; }
    
    if (registeredFullNames.has(val.toUpperCase().trim())){
      isBlocked = true;
      box.innerHTML = '<div class="blocked"><span class="icon">🚫</span><h3>Nama Sudah Terdaftar</h3><p>Nama <b>"'+val+'"</b> sudah pernah mengisi form jersey.<br>Setiap nama hanya boleh mendaftar <b>satu kali</b>.</p></div>';
      selectEl.classList.add('invalid');
      setBadge('fullNameBadge','bad','✗ Terdaftar');
      disableForm();
      toast('Nama ini sudah terdaftar, silakan pilih nama lain.', 'warning');
    } else {
      box.innerHTML = ''; isBlocked = false;
      selectEl.classList.remove('invalid'); selectEl.classList.add('valid');
      setBadge('fullNameBadge','ok','✓ Belum terdaftar');
      enableForm();
    }
    updateProgress();
  }

  function disableForm(){
    namaJerseyEl.disabled = true; noPunggungEl.disabled = true; submitBtn.disabled = true;
    document.querySelectorAll('.size-btn').forEach(x=>{ x.style.pointerEvents='none'; x.style.opacity=.4; x.classList.remove('selected'); });
    selectedSize = '';
  }
  function enableForm(){
    namaJerseyEl.disabled = false; noPunggungEl.disabled = false; submitBtn.disabled = false;
    document.querySelectorAll('.size-btn').forEach(x=>{ x.style.pointerEvents='auto'; x.style.opacity=1; });
  }

  function validateNamaJersey(){
    let v = namaJerseyEl.value.toUpperCase();
    const filtered = v.replace(/[^A-Z ]/g, '');
    if (filtered !== v) namaJerseyEl.value = filtered;
    v = filtered.trim();

    namaJerseyEl.classList.remove('valid','invalid');
    if (!v){ clearBadge('namaJerseyBadge'); updateProgress(); return; }
    
    if (v.length < 2){
      namaJerseyEl.classList.add('invalid'); setBadge('namaJerseyBadge','bad','✗ Terlalu pendek');
    } else if (takenNames.has(v)){
      namaJerseyEl.classList.add('invalid'); setBadge('namaJerseyBadge','bad','✗ Sudah dipakai');
    } else {
      namaJerseyEl.classList.add('valid'); setBadge('namaJerseyBadge','ok','✓ Tersedia');
    }
    updateProgress();
  }

  function validateNoPunggung(){
    let v = noPunggungEl.value.replace(/[^0-9]/g, '');
    if (v.length > 4) v = v.slice(0, 4);
    if (v !== noPunggungEl.value) noPunggungEl.value = v;

    noPunggungEl.classList.remove('valid','invalid');
    if (!v){ clearBadge('noPunggungBadge'); updateProgress(); return; }
    
    const num = parseInt(v, 10);
    if (num < 1 || num > 1000){
      noPunggungEl.classList.add('invalid'); setBadge('noPunggungBadge','bad','✗ Harus 1–1000');
    } else if (takenNumbers.has(String(num))){
      noPunggungEl.classList.add('invalid'); setBadge('noPunggungBadge','bad','✗ Sudah dipakai');
    } else {
      noPunggungEl.classList.add('valid'); setBadge('noPunggungBadge','ok','✓ Tersedia');
    }
    updateProgress();
  }

  selectEl.addEventListener('change', checkFullName);
  namaJerseyEl.addEventListener('input', validateNamaJersey);
  noPunggungEl.addEventListener('input', validateNoPunggung);

  function submitForm(e){
    e.preventDefault();
    if (isBlocked) return toast('Nama ini sudah terdaftar.', 'warning');

    const namaLengkap = selectEl.value;
    const namaJersey  = namaJerseyEl.value.trim().toUpperCase();
    const noPunggung  = noPunggungEl.value.trim();

    if (!namaLengkap) return toast('Pilih nama lengkap.', 'error');
    if (!namaJersey || namaJersey.length < 2) return toast('Isi nama jersey min 2 huruf.', 'error');
    if (!noPunggung) return toast('Isi nomor punggung.', 'error');
    if (!selectedSize) return toast('Pilih ukuran jersey.', 'error');

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span>Menyimpan...</span>';

    const payload = { 
      namaLengkap, 
      namaJersey, 
      noPunggung, 
      ukuran: selectedSize 
    };

    fetch(GAS_URL, {
      method: "POST",
      body: JSON.stringify(payload),
      headers: { "Content-Type": "text/plain;charset=utf-8" }
    })
    .then(res => res.json())
    .then(res => {
      if (res.success) {
        toast('Data berhasil disimpan!', 'success');
        showSuccess(namaLengkap, namaJersey, noPunggung, selectedSize, res.message);
      } else {
        toast(res.message || 'Gagal menyimpan.', 'error');
        submitBtn.disabled = false; submitBtn.innerHTML = '<span>Simpan Data</span>';
        loadExisting();
      }
    })
    .catch(err => {
      toast('Error koneksi ke server.', 'error');
      submitBtn.disabled = false; submitBtn.innerHTML = '<span>Simpan Data</span>';
    });
  }

  function showSuccess(namaLengkap, namaJersey, noPunggung, ukuran, msg){
    progressFill.style.width = '100%';
    progressText.textContent = '4/4';
    document.getElementById('mainCard').innerHTML = 
      '<div class="success-screen">' +
        '<div class="success-ring">✓</div>' +
        '<h2>Data Berhasil Disimpan!</h2>' +
        '<p style="color:var(--muted);margin-bottom:22px">'+(msg||'Data jersey Anda sudah tercatat.')+'</p>' +
        '<div class="success-details">' +
          '<div class="row"><span class="k">Nama Lengkap</span><span class="v">'+namaLengkap+'</span></div>' +
          '<div class="row"><span class="k">Nama Jersey</span><span class="v">'+namaJersey+'</span></div>' +
          '<div class="row"><span class="k">No Punggung</span><span class="v">'+noPunggung+'</span></div>' +
          '<div class="row"><span class="k">Ukuran</span><span class="v">'+ukuran+'</span></div>' +
        '</div>' +
        '<button class="btn" style="max-width:280px;margin:0 auto" onclick="location.reload()">Isi Data Lagi</button>' +
      '</div>';
    window.scrollTo({top:0,behavior:'smooth'});
  }

  loadExisting();
</script>
</body>
</html>
